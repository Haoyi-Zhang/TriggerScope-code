name: Scientific checks
"on": [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  scientific-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Prepare fresh output and record the runtime
        run: |
          set -euo pipefail
          test -f reproduce.py
          root="$(mktemp -d "$RUNNER_TEMP/p007-scientific.XXXXXXXX")"
          mkdir "$root/tmp"
          printf 'P007_RESULT_DIR=%s\nTMPDIR=%s/tmp\n' "$root" "$root" >> "$GITHUB_ENV"
          export P007_RESULT_DIR="$root"
          python - <<'PY'
          import json, os, platform, sys
          from pathlib import Path
          record = {
              "python": sys.version,
              "platform": platform.platform(),
              "commit": os.environ.get("GITHUB_SHA"),
              "runner_image_os": os.environ.get("ImageOS"),
              "runner_image_version": os.environ.get("ImageVersion"),
              "scientific_workers": 1,
              "address_space_limit_bytes_per_process": 3 * 1024 ** 3,
              "cpu_limit_seconds_per_process": 600,
              "unit_test_wall_timeout_seconds": 60,
              "reproduction_wall_timeout_seconds": 600,
              "subprocess_wall_timeout_seconds": 45,
              "case_wall_timeout_seconds": 20,
              "job_timeout_minutes": 15,
          }
          (Path(os.environ["P007_RESULT_DIR"]) / "environment.json").write_text(
              json.dumps(record, indent=2) + "\n", encoding="utf-8"
          )
          PY
          find data results -type f -print0 | sort -z | xargs -0 sha256sum > "$root/frozen-inputs-results.sha256"

      - name: Run separate totality and consumed-byte regressions
        timeout-minutes: 2
        run: |
          set -euo pipefail
          ulimit -v 3145728
          ulimit -t 600
          set +e
          /usr/bin/time -v -o "$P007_RESULT_DIR/unit-tests.time.txt" \
            timeout --signal=TERM --kill-after=10s 60s \
            python -m unittest -v tests.test_overlap_totality tests.test_adapter_read_limits \
            2>&1 | tee "$P007_RESULT_DIR/unit-tests.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$P007_RESULT_DIR/unit-tests-exit-code.txt"
          exit "$status"

      - name: Reproduce the complete frozen scientific campaign
        timeout-minutes: 11
        run: |
          set -euo pipefail
          ulimit -v 3145728
          ulimit -t 600
          set +e
          /usr/bin/time -v -o "$P007_RESULT_DIR/reproduction.time.txt" \
            timeout --signal=TERM --kill-after=10s 600s \
            python reproduce.py --output "$P007_RESULT_DIR/reproduction" --chunk-size 200 \
            2>&1 | tee "$P007_RESULT_DIR/reproduction.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$P007_RESULT_DIR/reproduction-exit-code.txt"
          exit "$status"

      - name: Check frozen inputs and retained evidence were not changed
        if: ${{ always() && env.P007_RESULT_DIR != '' }}
        run: |
          set -euo pipefail
          sha256sum --check "$P007_RESULT_DIR/frozen-inputs-results.sha256" \
            > "$P007_RESULT_DIR/frozen-file-check.log" 2>&1
          git status --porcelain -- data results > "$P007_RESULT_DIR/frozen-git-status.txt"
          test ! -s "$P007_RESULT_DIR/frozen-git-status.txt"

      - name: Upload scientific results, logs, and measured resources
        if: ${{ always() && env.P007_RESULT_DIR != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p007-scientific-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.P007_RESULT_DIR }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
